name: Build, Stage and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --if-present
      - run: npm run build --if-present
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://cityhub-isp-staging.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cityhub-isp-staging
          package: .
      - name: Verify staging
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cityhub-isp-staging.azurewebsites.net)
          echo "Staging returned HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "Staging healthy" || (echo "Staging check failed" && exit 1)

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://cityhub-isp.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
          path: .
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRODUCTION }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cityhub-isp
          package: .
      - name: Verify production
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cityhub-isp.azurewebsites.net)
          echo "Production returned HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "Production live" || (echo "Production check failed" && exit 1)