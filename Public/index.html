<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityHub ISP Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h1>CityHub ISP Login</h1>

    <!-- Tab Buttons -->
    <div class="tab-buttons">
      <button class="tab-btn active" data-target="customer-form">Customer</button>
      <button class="tab-btn" data-target="admin-form">Admin</button>
    </div>

    <!-- Customer Login Form -->
    <form id="customer-form" class="form active">
      <div class="form-group">
        <label for="customer-username">Username</label>
        <input type="text" id="customer-username" name="username" required>
      </div>
      <div class="form-group">
        <label for="customer-password">Password</label>
        <input type="password" id="customer-password" name="password" required>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>

    <!-- Admin Login Form -->
    <form id="admin-form" class="form">
      <div class="form-group">
        <label for="admin-username">Admin ID</label>
        <input type="text" id="admin-username" name="username" required>
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" name="password" required>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="footer">
      <p>&copy; 2026 CityHub ISP. All rights reserved.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
